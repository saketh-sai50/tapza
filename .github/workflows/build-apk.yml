name: Build Tapza Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/Tapza-Meds.apk \;
          cp output/Tapza-Meds.apk output/Tapza-Radar.apk
          ls -lh output/

      - name: Upload Tapza Meds APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapza-Meds-Android-APK
          path: output/Tapza-Meds.apk
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.17-meds
          name: "Tapza Meds v1.0.17 (Custom Medicine App Icon & Rebranded Name)"
          body: "Official Tapza Meds Android APK with custom medical cross & capsule pill icon. Features live GPS ordering, 5km/10km radius expansion, and instant over-the-air updates."
          files: |
            output/Tapza-Meds.apk
            output/Tapza-Radar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
