name: Build Tapza Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/Tapza-Radar.apk \;
          ls -lh output/

      - name: Upload Tapza Radar APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapza-Radar-Android-APK
          path: output/Tapza-Radar.apk
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.12-radar
          name: "Tapza Radar v1.0.12 (Geoapify 5km Spatial Radius & Live Map Radar)"
          body: "Official standalone Tapza Radar Android APK (com.tapza.radar). Features SQLite R*Tree spatial matching, Geoapify address autocomplete, dynamic 5km to 10km radius auto-expansion, and real-time interactive map radar with pharmacy pins. Installs side-by-side with Tapza Classic without replacing it."
          files: output/Tapza-Radar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
