name: Build Tapza Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/Tapza.apk \;
          ls -lh output/

      - name: Upload Tapza APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapza-Android-APK
          path: output/Tapza.apk
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10
          name: "Tapza Android App v1.0.10 (Multi-Pharmacy Quote Isolation & Independent Dashboard Bidding)"
          body: "Official Android APK release with strict per-pharmacy credential quote isolation, customer master order protection, independent substitute medicine remarks, and dedicated draft scoping."
          files: output/Tapza.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
